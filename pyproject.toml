[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-gate"
version = "0.1.0"
description = "A deterministic-first safety gate for coding-agent trajectories that escalates only ambiguous cases to an NVIDIA open-source model on Nebius Token Factory."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "<COPYRIGHT_HOLDER>" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
relay-gate = "relay_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
